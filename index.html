<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Choco 3D Studio - VRM / MToon 專業工作台</title>
    <!-- 引入 Three.js 與 GLTFExporter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <style>
        :root {
            --mint-primary: #98FF98;
            --mint-light: #C1FFC1;
            --mint-dark: #68d89d;
            --choco-dark: #3E2723;
            --choco-light: #5D4037;
            --bg-dark: #121212;
            --bg-panel: #1E1E1E;
            --text-main: #F5F2EB;
            --accent-orange: #ff7518;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header {
            background-color: var(--choco-dark);
            border-bottom: 2px solid var(--mint-primary);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 24px; height: 24px; background: var(--mint-primary); border-radius: 4px; }
        h1 { font-size: 1.1rem; color: var(--mint-primary); letter-spacing: 1px; }
        .subtitle { font-size: 0.8rem; color: #b0bec5; margin-left: 10px; }

        .main-container { flex: 1; display: flex; height: calc(100vh - 50px); width: 100vw; overflow: hidden; }
        
        #viewer-container { flex: 1; position: relative; background: #0b0b0b; height: 100%; min-width: 300px; }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        .viewport-hud {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(30,30,30,0.85); border: 1px solid var(--mint-primary);
            padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; color: var(--mint-light);
            pointer-events: none;
        }

        .panel-container {
            width: 420px; min-width: 350px; max-width: 500px;
            background-color: var(--bg-panel);
            border-left: 2px solid var(--choco-light);
            display: flex; flex-direction: column; height: 100%;
        }

        .tabs { display: flex; background: #161616; border-bottom: 1px solid #333; flex-shrink: 0; }
        .tab-btn {
            flex: 1; padding: 12px; background: none; border: none; color: #888;
            font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .tab-btn.active { color: var(--mint-primary); background: var(--bg-panel); border-bottom: 2px solid var(--mint-primary); }

        .tab-content { flex: 1; display: none; flex-direction: column; padding: 15px; overflow-y: auto; }
        .tab-content.active { display: flex; }

        .log-box {
            flex: 1; background: #0f0f0f; border: 1px solid #333; border-radius: 6px;
            padding: 10px; font-family: monospace; font-size: 0.8rem; color: #a5d6a7;
            overflow-y: auto; margin-bottom: 15px; min-height: 120px; max-height: 250px;
        }

        .doc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .btn-copy {
            background-color: #2e7d32; color: white; border: none; padding: 4px 10px;
            border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-copy:hover { background-color: #388e3c; }

        .doc-box {
            flex: 1; background: #0f0f0f; border: 1px solid #333; border-radius: 6px;
            padding: 10px; font-family: monospace; font-size: 0.8rem; color: #ffccbc;
            white-space: pre-wrap; overflow-y: auto;
        }

        .input-section { display: flex; flex-direction: column; gap: 8px; margin-top: auto; flex-shrink: 0; }
        label { font-size: 0.85rem; color: var(--mint-light); font-weight: 600; }
        
        textarea {
            width: 100%; height: 160px; background: #121212; border: 1px solid #444;
            border-radius: 6px; color: var(--text-main); padding: 10px;
            font-family: monospace; font-size: 0.85rem; resize: vertical;
        }
        textarea:focus { border-color: var(--mint-primary); outline: none; }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .btn-primary { background-color: var(--mint-primary); color: var(--choco-dark); }
        .btn-primary:hover { background-color: var(--mint-dark); }
        .btn-danger { background-color: #d32f2f; color: white; }
        .btn-danger:hover { background-color: #b71c1c; }
        .btn-export { background-color: var(--accent-orange); color: white; padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-export:hover { background-color: #e65100; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"></div>
            <h1>Mint Choco 3D Studio</h1>
            <span class="subtitle">VRM / MToon 模式</span>
        </div>
        <button class="btn-export" onclick="exportGLB()">📥 匯出 .GLB 檔案</button>
    </header>

    <div class="main-container">
        <!-- 3D 預覽畫面 -->
        <div id="viewer-container">
            <canvas id="canvas3d"></canvas>
            <div class="viewport-hud">💡 支援一鍵複製狀態文檔</div>
        </div>

        <!-- 右側控制面板 -->
        <div class="panel-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('terminal')">⚡ 指令執行終端</button>
                <button class="tab-btn" onclick="switchTab('docs')">📜 執行狀態文檔</button>
            </div>

            <!-- 終端分頁 -->
            <div id="tab-terminal" class="tab-content active">
                <div class="log-box" id="logBox">[系統初始化] 狀態文檔已支援一鍵複製按鈕。</div>
                <div class="input-section">
                    <label>🤖 AI 指令輸入區</label>
                    <textarea id="commandInput">{
  "action": "create_geometry",
  "type": "pumpkin",
  "color": "#ff7518",
  "segments": 16,
  "position": [0, 0, 0],
  "scale": [1, 1, 1],
  "invertAxis": false
}</textarea>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="executeCommand()">🚀 執行指令</button>
                        <button class="btn btn-danger" onclick="clearScene()">🗑️ 清空場景</button>
                    </div>
                </div>
            </div>

            <!-- 文檔分頁 -->
            <div id="tab-docs" class="tab-content">
                <div class="doc-header">
                    <label>📋 場景狀態文檔</label>
                    <button class="btn-copy" onclick="copyStateDoc()">📋 複製文檔</button>
                </div>
                <div class="doc-box" id="docBox">{
  "sceneStatus": "active",
  "totalObjects": 0,
  "totalTriangles": 0,
  "hierarchyTree": []
}</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let createdObjects = [];

        function init3D() {
            const container = document.getElementById('viewer-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b0b);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(20, 20, 0x98FF98, 0x333333);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
            animate();
            logMessage("渲染引擎就緒。");
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (tabName === 'terminal') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-terminal').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-docs').classList.add('active');
            }
        }

        function logMessage(msg) {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `\n[${time}] > ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        function updateDocs() {
            let totalTris = 0;
            const hierarchyTree = createdObjects.map((obj, idx) => {
                let objTris = 0;
                let childrenNodes = [];

                obj.traverse(child => {
                    if (child.isMesh && child.geometry) {
                        const geom = child.geometry;
                        let tris = 0;
                        if (geom.index) {
                            tris = geom.index.count / 3;
                        } else if (geom.attributes.position) {
                            tris = geom.attributes.position.count / 3;
                        }
                        objTris += tris;
                        childrenNodes.push({
                            nodeName: child.name || "Unnamed_Mesh",
                            namingConvention: "PascalCase",
                            triangleCount: tris
                        });
                    }
                });
                totalTris += objTris;

                return {
                    nodeId: idx,
                    parentGroup: obj.name,
                    namingConvention: "PascalCase (VRM Standard)",
                    totalGroupTriangles: objTris,
                    transform: {
                        position: [Number(obj.position.x.toFixed(2)), Number(obj.position.y.toFixed(2)), Number(obj.position.z.toFixed(2))],
                        scale: [Number(obj.scale.x.toFixed(2)), Number(obj.scale.y.toFixed(2)), Number(obj.scale.z.toFixed(2))]
                    },
                    properties: {
                        segments: obj.userData.segments || 16,
                        invertedAxis: obj.userData.inverted || false
                    },
                    childrenNodes: childrenNodes
                };
            });

            const doc = {
                sceneStatus: "active",
                totalObjects: createdObjects.length,
                totalTriangles: totalTris,
                cameraPosition: [Number(camera.position.x.toFixed(2)), Number(camera.position.y.toFixed(2)), Number(camera.position.z.toFixed(2))],
                hierarchyTree: hierarchyTree
            };
            document.getElementById('docBox').innerText = JSON.stringify(doc, null, 2);
        }

        // 複製狀態文檔功能
        function copyStateDoc() {
            const textToCopy = document.getElementById('docBox').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                logMessage("📋 狀態文檔已成功複製到剪貼簿！");
            }).catch(err => {
                logMessage("❌ 複製失敗：" + err);
            });
        }

        function parseCommandSafe(rawText) {
            try {
                return JSON.parse(rawText);
            } catch (e1) {
                try {
                    let fixed = rawText.replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":');
                    return JSON.parse(fixed);
                } catch (e2) {
                    logMessage("⚠️ JSON 解析微瑕，自動套用預設建構！");
                    return { action: "create_geometry", type: "pumpkin", color: "#ff7518", segments: 16, position: [0,0,0], scale: [1,1,1], invertAxis: false };
                }
            }
        }

        function executeCommand() {
            const rawText = document.getElementById('commandInput').value;
            logMessage("執行自訂指令...");
            const cmd = parseCommandSafe(rawText);

            if (cmd.action === "create_geometry" || cmd.type === "pumpkin") {
                createPumpkin(
                    cmd.color || "#ff7518", 
                    cmd.segments || 16, 
                    cmd.position || [0, 0, 0], 
                    cmd.scale || [1, 1, 1], 
                    cmd.invertAxis || false
                );
            } else {
                createPumpkin("#98FF98", 16, [0, 0, 0], [1, 1, 1], false);
            }
            updateDocs();
        }

        function createPumpkin(colorHex, segments, pos, scl, invertAxis) {
            const pumpkinGroup = new THREE.Group();
            pumpkinGroup.name = "HalloweenPumpkin_" + (createdObjects.length + 1);
            pumpkinGroup.userData = { type: "pumpkin", segments: segments, inverted: invertAxis };

            const colorObj = new THREE.Color(colorHex);
            colorObj.convertSRGBToLinear();

            const bodyMat = new THREE.MeshToonMaterial({ color: colorObj, roughness: 0.3 });

            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const geom = new THREE.SphereGeometry(0.8, segments, segments);
                geom.scale(0.7, 1, 0.7);
                const mesh = new THREE.Mesh(geom, bodyMat);
                mesh.name = `PumpkinBodyPart_${i+1}`;
                mesh.position.x = Math.cos(angle) * 0.35;
                mesh.position.z = Math.sin(angle) * 0.35;
                pumpkinGroup.add(mesh);
            }

            const stemMat = new THREE.MeshToonMaterial({ color: 0x3E2723 });
            const stemGeom = new THREE.CylinderGeometry(0.1, 0.15, 0.5, Math.max(4, Math.floor(segments/2)));
            const stem = new THREE.Mesh(stemGeom, stemMat);
            stem.name = "PumpkinStem";
            stem.position.y = 1.0;
            stem.rotation.z = 0.15;
            pumpkinGroup.add(stem);

            pumpkinGroup.position.set(pos[0], pos[1], pos[2]);
            pumpkinGroup.scale.set(scl[0], scl[1], scl[2]);

            if (invertAxis) {
                pumpkinGroup.rotation.x = Math.PI;
                logMessage("🔄 偵測到軸向反轉指令");
            }

            scene.add(pumpkinGroup);
            createdObjects.push(pumpkinGroup);
            logMessage(`✅ 成功生成南瓜並更新文檔！`);
        }

        function clearScene() {
            createdObjects.forEach(obj => scene.remove(obj));
            createdObjects = [];
            logMessage("🗑️ 場景已清空。");
            updateDocs();
        }

        function exportGLB() {
            if (createdObjects.length === 0) {
                alert("目前場景沒有任何物件可匯出！");
                return;
            }
            const exporter = new THREE.GLTFExporter();
            const exportGroup = new THREE.Group();
            createdObjects.forEach(obj => exportGroup.add(obj.clone()));

            exporter.parse(exportGroup, function (gltf) {
                const blob = new Blob([gltf], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'vrm_ready_model.glb';
                link.click();
                logMessage("📥 成功匯出 VRM 適用之 .glb 檔案！");
            }, { binary: true });
        }

        window.onload = init3D;
    </script>
</body>
</html>
